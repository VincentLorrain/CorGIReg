[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corgireg-cli"
version = "0.1.0"
description = "Command-line graph pattern matching with the CorGIReg C++ engine"
requires-python = ">=3.10"

[project.optional-dependencies]
onnx = ["onnx>=1.16,<2"]
stablehlo = ["jaxlib>=0.12,<0.13"]

[project.scripts]
corgireg = "corgireg_cli.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
